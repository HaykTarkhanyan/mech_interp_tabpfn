    "numpy==2.5.4",
    "optuna==5.0.0",
    "pandas==2.3.3",
    "plotly==7.1.0",
    "pyarrow==26.0.0",
    "pytorch-lightning==2.6.6",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
