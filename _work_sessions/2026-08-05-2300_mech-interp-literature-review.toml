notes = """
Three external services rate-limited during the session and each needed a different response.
arXiv's API returned 429 to every request including trivial ones (503 with a browser UA), so
it was dropped as a search backend - but arxiv.org/abs stayed reachable and serves citation_*
meta tags, which became the preprint verification path. Semantic Scholar's keyless pool was
429 throughout. OpenAlex worked for the main sweep (800 records) then began 429-ing after
roughly 200 requests total.

Two bugs in my own code were found only by inspecting individual records rather than counts:
dedup left identical DOIs duplicated (two dicts of records merged by a non-mutating helper,
so the indexes drifted), and the relevance screen was rejecting records for having no
abstract rather than for being off-topic (49% of records had none). Both are written up in
_learnings/. The lesson generalises: aggregate counts looked entirely reasonable in both
cases.

Playwright earned its place - transformer-circuits.pub renders bylines client-side, so
curl-based extraction returns no authors at all. Three pages also needed wait_until="commit"
plus an explicit wait for the byline, because "networkidle" never fires on pages with
streaming visualisations and "domcontentloaded" still timed out on the multi-megabyte
monosemanticity write-ups.
"""
