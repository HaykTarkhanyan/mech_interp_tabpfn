notes = """
The title-match guard paid off twice more, on top of the two catches during the literature
review. Both cases were papers retitled between arXiv versions while DBLP kept the original
title: 2501.02945 (DBLP: "The Tabular Foundation Model TabPFN Outperforms Specialized Time
Series..." -> arXiv: "From Tables to Time: Extending TabPFN-v2 to Time Series Forecasting",
this is TabPFN-TS) and 2602.04596 (DBLP: "A principled framework for uncertainty
decomposition in TabPFN" -> arXiv: "Uncertainty Decomposition for Bayes-Filtered Transformers
via Bayesian Predictive Inference"). Both were checked against their abstracts and confirmed
to be the intended work before the expected titles were updated. Neither was auto-accepted.
The general lesson: a bibliography database's title is a snapshot, and preprints are mutable.

One self-inflicted bug worth remembering: naming a local variable `html` inside a function
that also calls `html.unescape()` shadows the stdlib module and fails with
"'str' object has no attribute 'unescape'". It only surfaced on the second run, because the
first run predated the html.unescape() call being added.

arXiv's website remains reachable from this network while its API stays HTTP 429 - the abs
pages serve citation_* meta tags and /pdf/ downloads work fine. That asymmetry is now load
bearing for two scripts in this repo.
"""
