notes = """
Cost: subagents used about 2.0M tokens (web sweep 0.2M, readers 0.57M + 0.57M + 0.69M), about 60% more per
reader than estimated. Wall clock about 2 hours.

Rate limits shaped the method again. The arXiv API went from 200 to 429 within ten minutes because another
Claude session's synthetic_data/scripts/lit_references.py was hitting it from the same IP; it recovered
when that process ended. Semantic Scholar's keyless pool answers one request and then 429s for minutes.
Claude Code killed the first background search for low RAM (1.3 GB of 15.6 GB free, four Claude sessions
plus VS Code open); the script itself used almost none.

The readers found real problems inside papers: a LIBERO-PRO evaluation-code bug (original instruction fed
in Semantic and Task cells), a paper labelling its own key figures "illustrative pending verification",
table/text mismatches in two papers, and a SAFECAST "ROC-AUC" that goes below 0.5.

Two Bash-tool gotchas recurred: heredocs containing quotes fail in the Bash tool (use the Edit tool), and
Windows Python does not understand /c/... paths (use C:\\ paths or a script file).
"""
